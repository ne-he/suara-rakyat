<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1430" width="880" height="1430" role="img" aria-label="Kerangka berpikir Suara Rakyat"><defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#141210"/></marker><marker id="panah-garis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10" fill="none" stroke="#141210" stroke-width="1.6"/></marker></defs><rect width="880" height="1430" fill="#f6f1e7"/><text x="440.0" y="38.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#141210">Kerangka berpikir</text><text x="440.0" y="62.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6f675c">dari keluhan warga sampai simpulan laporan</text><rect x="130.0" y="96.0" width="470.0" height="66.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="365.0" y="125.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Masalah: keluhan warga tersebar di kolom ulasan,</text><text x="365.0" y="141.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">tidak mungkin dibaca satu per satu</text><path d="M365.0,162.0L365.0,190.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="192.0" width="470.0" height="66.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="365.0" y="221.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Data IGAR: 617.722 ulasan, 6 aplikasi layanan publik,</text><text x="365.0" y="237.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">label diturunkan dari bintang</text><path d="M365.0,258.0L365.0,286.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="288.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="317.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Audit dan pembersihan: teks kembar digabung,</text><text x="365.0" y="333.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">tersisa 361.287 teks unik</text><path d="M365.0,354.0L365.0,382.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="384.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="413.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Pembagian data dengan hash teks:</text><text x="365.0" y="429.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">80 persen latih, 10 validasi, 10 uji</text><path d="M365.0,450.0L365.0,478.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="480.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="509.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Fitur TF-IDF kata 1-2 gram dan karakter 2-5 gram,</text><text x="365.0" y="525.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">plus kamus slang Indonesia</text><path d="M365.0,546.0L365.0,574.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="576.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="605.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Latih 30 konfigurasi: SVM, Logistic Regression, Naive</text><text x="365.0" y="621.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Bayes, Ridge, SGD, LightGBM, IndoBERTweet</text><path d="M365.0,642.0L365.0,670.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="672.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="701.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Pilih model di data validasi,</text><text x="365.0" y="717.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">lalu geser ambang tiap kelas</text><path d="M365.0,738.0L365.0,766.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="768.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="797.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Uji di data test: macro-F1, presisi, recall,</text><text x="365.0" y="813.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">dan selang kepercayaan bootstrap 1.000 kali</text><path d="M365.0,860.0L490.0,908L365.0,956.0L240.0,908Z" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="365.0" y="912.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#141210">cukup akurat dan cukup cepat?</text><path d="M365.0,834.0L365.0,860.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><path d="M490.0,908.0L800.0,908.0L800.0,609.0L602.0,609.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><text x="690.0" y="898.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6f675c">belum</text><text x="798.0" y="550.0" text-anchor="end" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6f675c">ulangi dengan setelan lain</text><rect x="130.0" y="974.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="1003.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Ekspor bobot ke TypeScript,</text><text x="365.0" y="1019.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">diuji sama persis di 3.018 teks</text><path d="M365.0,1040.0L365.0,1068.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="1070.0" width="470.0" height="66.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="365.0" y="1099.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Produk web: baca satu ulasan, cek massal,</text><text x="365.0" y="1115.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">dashboard bukti, tren keluhan</text><path d="M365.0,1136.0L365.0,1164.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="1166.0" width="470.0" height="66.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="365.0" y="1195.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Evaluasi subjektif (kuesioner SUS) dan objektif</text><text x="365.0" y="1211.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">(paper IGAR, VADER, uji bahasa, anotasi manusia)</text><path d="M365.0,1232.0L365.0,1260.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="130.0" y="1262.0" width="470.0" height="66.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="365.0" y="1299.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210">Simpulan dan saran</text><path d="M365.0,956.0L365.0,972.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><text x="401.0" y="958.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6f675c">sudah</text></svg>