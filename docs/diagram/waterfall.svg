uhan baru masuk ke putaran berikutnya</text><text x="70.0" y="894.0" text-anchor="start" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#141210" xml:space="preserve">Putaran yang sudah dilalui (tanggal dari riwayat commit Git):</text><rect x="70.0" y="908.0" width="262.0" height="52.0" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="2"/><text x="201.0" y="930.8" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">v1, 17 Sep 2026</text><text x="201.0" y="945.3" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">model dan web prediksi pertama</text><rect x="350.0" y="908.0" width="262.0" height="52.0" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="2"/><text x="481.0" y="930.8" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">v2, 19 Sep 2026</text><text x="481.0" y="945.3" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">cek massal, kuesioner SUS, tren keluhan</text><rect x="630.0" y="908.0" width="262.0" height="52.0" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="2"/><text x="761.0" y="930.8" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">v3, 23 Sep 2026</text><text x="761.0" y="945.3" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#141210" xml:space="preserve">evaluasi tambahan dan diagram laporan</text><rect x="910.0" y="908.0" width="262.0" height="52.0" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="2"/><te