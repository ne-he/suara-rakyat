<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 856" width="1300" height="856" role="img" aria-label="Sequence diagram baca satu ulasan"><defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#141210"/></marker><marker id="panah-garis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10" fill="none" stroke="#141210" stroke-width="1.6"/></marker><marker id="segitiga" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L12,6L0,12Z" fill="#f6f1e7" stroke="#141210" stroke-width="1.4"/></marker></defs><rect width="1300" height="856" fill="#f6f1e7"/><text x="650.0" y="34.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#141210" xml:space="preserve">Sequence diagram: satu ulasan dibaca</text><rect x="20.0" y="58.0" width="180.0" height="52.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="110.0" y="88.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210" xml:space="preserve">Pengguna</text><path d="M110,110V800" stroke="#6f675c" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="260.0" y="58.0" width="180.0" height="52.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="350.0" y="80.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210" xml:space="preserve">Halaman web</text><text x="350.0" y="96.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#141210" xml:space="preserve">(Analyzer)</text><path d="M350,110V800" stroke="#6f675c" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="530.0" y="58.0