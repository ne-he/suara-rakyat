 width="886" height="44" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="1.6"/><text x="338.0" y="556.5" text-anchor="start" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5" font-weight="400" fill="#141210" xml:space="preserve">187 potongan, contoh dari token login (_ = batas kata): _l, lo, og, gi, in, n_, _lo, log, ogi, ...</text><path d="M300.0,552.0L322.0,552.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><path d="M165.0,574.0L165.0,590.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="30.0" y="592.0" width="270.0" height="54.0" rx="6" fill="#f6f1e7" stroke="#141210" stroke-width="2"/><text x="165.0" y="623.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#141210" xml:space="preserve">8. TF-IDF dan L2</text><rect x="324" y="592" width="886" height="54" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="1.6"/><text x="338.0" y="618.0" text-anchor="start" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5" font-weight="400" fill="#141210" xml:space="preserve">18 kolom kata dan 163 kolom karakter terisi. Bobot kata tertinggi: coba otp 0,42; 3x coba 0,37; aplikasinyaa</text><text x="338.0" y="635.0" text-anchor="start" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5" font-weight="400" fill="#141210" xml:space="preserve">0,33; sudah 3x 0,28; login sudah 0,28</text><path d="M300.0,619.0L322.0,619.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><path d="M165.0,646.0L165.0,662.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><rect x="30.0" y="664.0" width="270.0" height="44.0" rx="6" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="165.0" y="690.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#141210" xml:space="preserve">9. Linear SVM</text><rect x="324" y="664" width="886" height="44" rx="6" fill="#ffffff" stroke="#d9ceb8" stroke-width="1.6"/><text x="338.0" y="690.5" text-anchor="start" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5" font-weight="400" fill="#141210" xml:space="preserve">skor kelas + geser bias, softmax: negatif 0,89, netral 0,10, positif 0,01. Hasil: negatif</text><path d="M300.0,686.0L322.0,686.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/></svg>