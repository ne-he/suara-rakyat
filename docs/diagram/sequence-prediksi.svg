11" font-weight="500" fill="#141210" xml:space="preserve">skor Linear SVM + bias,</text><text x="1005.0" y="585.4" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#141210" xml:space="preserve">softmax, kata penentu</text><path d="M1120.0,640.0L620.0,640.0" stroke="#141210" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#panah-garis)"/><text x="870.0" y="632.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">Prediction</text><path d="M620.0,690.0L350.0,690.0" stroke="#141210" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#panah-garis)"/><text x="485.0" y="682.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">{label, probs, tokens}</text><path d="M350.0,745.0L110.0,745.0" stroke="#141210" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#panah-garis)"/><text x="230.0" y="737.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">nada, tingkat yakin, kata penentu</text><text x="650.0" y="836.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6f675c" xml:space="preserve">Teks yang dikirim tidak disimpan di mana pun. Bobot model dimuat sekali per instance server, jadi panggilan berikutnya langsung dihitung.</text></svg>