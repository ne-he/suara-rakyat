al, sans-serif" font-size="12" font-weight="700" fill="#f6f1e7" xml:space="preserve">alt</text><text x="136.0" y="189.0" text-anchor="start" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6f675c" xml:space="preserve">[teks kosong]</text><path d="M350.0,222.0L110.0,222.0" stroke="#141210" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#panah-garis)"/><text x="230.0" y="214.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">pesan: tulis atau tempel ulasanmu dulu</text><path d="M350.0,282.0L620.0,282.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><text x="485.0" y="274.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">POST /api/predict {text}</text><rect x="614" y="282" width="12" height="433" fill="#f6f1e7" stroke="#141210" stroke-width="1.5"/><path d="M620.0,318.0L870.0,318.0" stroke="#141210" stroke-width="1.8" fill="none" marker-end="url(#panah)"/><text x="745.0" y="310.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">limited(ip, 60 per menit)</text><path d="M870.0,346.0L620.0,346.0" stroke="#141210" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#panah-garis)"/><text x="745.0" y="338.0" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#141210" xml:space="preserve">boleh</text><rect x="650.0" y="360.0" width="210.0" height="48.0" rx="4" fill="#efe7d6" stroke="#141210" stroke-width="2"/><text x="755.0" y="380.9" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#141210" xml:space="p